<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chris Bottle Crafters – Daily Sale Manager</title>
<style>
:root{--bg:#f6f7f4;--fg:#1d2420;--card:#fff;--mut:#66706a;--ac:#1f7a4d;--acf:#fff;--bd:#dfe4dc;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131815;--fg:#e8ece9;--card:#1c231f;--mut:#9aa59d;--ac:#4fc08a;--acf:#0d1a12;--bd:#2d3731;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131815;--fg:#e8ece9;--card:#1c231f;--mut:#9aa59d;--ac:#4fc08a;--acf:#0d1a12;--bd:#2d3731;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}h2{font-size:15px;margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
nav button{flex:1;min-width:90px;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
button.p{background:var(--ac);color:var(--acf);border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
button.s{background:none;border:1px solid var(--bd);color:var(--fg);border-radius:6px;padding:5px 9px;font:inherit;cursor:pointer}
.ln{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.ln input,.ln select{flex:1;min-width:110px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
tfoot td,tr.t td{font-weight:700}
.kpi{font-size:22px;font-weight:700}.mut{color:var(--mut);font-size:12px}.bad{color:var(--bad)}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--bd);font-size:11px}
.help{font-size:12px;color:var(--mut);margin-top:8px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:12px;z-index:9}
#modal .card{max-width:420px;width:100%;margin:0}
.warn{background:var(--bd);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px}
.pshow{display:none}.ro .wr{display:none!important}
@media print{
 html:root:not([data-theme="zz"]){--bg:#fff;--fg:#000;--card:#fff;--mut:#444;--bd:#bbb;--bad:#000;color-scheme:light}
 nav,#warn,button,.noprint,#modal,.help,#report>.card:first-child,#inc>.card:first-child,#month>.card:first-child,#dash>.card:first-child{display:none!important}
 .pshow{display:block;font-weight:700;font-size:16px;margin-bottom:8px}
 .wrap{max-width:none;padding:0}.card{border:0;padding:4px 0;break-inside:avoid}
 .sc{overflow:visible}table{font-size:11px}th,td{padding:3px 5px}
 input,select{border:0;background:none;padding:0;appearance:none}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap">
<h1>Chris Bottle Crafters – Daily Sale Manager</h1>
<div id="warn"></div><div id="phead" class="pshow"></div>
<nav id="nav"></nav>
<section id="dash"></section><section id="entry"></section><section id="report" hidden></section><section id="pending" hidden></section><section id="rep" hidden></section><section id="inc" hidden></section><section id="month" hidden></section>
<div id="toast" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:10;font-size:14px"></div>
<div id="modal"><div class="card" id="mbox"></div></div>
</div>
<script>
/* ======== SUPABASE SETTINGS – paste your own two values (Supabase > Project Settings > API Keys) ========
   Use the PUBLISHABLE key (sb_publishable_...) or the legacy anon key. NEVER use a secret / service_role key here. */
const SUPABASE_URL='https://hscthdlawgutffetphmp.supabase.co/rest/v1/';
const SUPABASE_KEY='sb_publishable_1soI-v725uPW7FLkGjfdZg_tvkwdfJB	';
/* ======================================================================================================== */
const STAFF=['GE VARGHESE','ABI','NISHANTH','ANANDHU','ANANDHU NEW','SOUMYA','ARYA','ANNA','APPU'];
const MODES=['CASH','DLAKSHMI','G PAY','PHPAY','YB POS','CARD','YB ACCOUNT','HDFC','PAID EARLIER','NP'];
const TABS=[['dash','Dashboard'],['entry','Entry'],['report','Day report'],['pending','Pending bills'],['inc','Incentive'],['month','Month'],['rep','Report']];
const S={entries:[],expenses:[]};let D={},RO=false,tab='dash';
const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('en-IN').format(Math.round(n||0));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let day=today(),month=today().slice(0,7);
const opts=a=>a.map(x=>`<option>${x}</option>`).join('');
function note(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>t.style.display='none',6000)}
function ask(msg,fn){$('#mbox').innerHTML=`<h2>${esc(msg)}</h2><div style="display:flex;gap:8px;margin-top:10px"><button class="p" id="yes">Yes, delete</button><button class="s" onclick="$('#modal').style.display='none'">Cancel</button></div>`;$('#modal').style.display='flex';$('#yes').onclick=()=>{$('#modal').style.display='none';fn()}}
const oops=e=>note('Could not save: '+((e&&e.message)||e));
/* ---- data layer: Supabase (PostgreSQL) ---- */
const sb=(window.supabase&&!SUPABASE_URL.includes('YOUR-'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const DAYF=['ob','drinks','other'];
async function fetchAll(c){ /* Supabase returns max 1000 rows per request, so read in pages */
  const out=[],ord=c==='days'?'day':'created_at';
  for(let from=0;;from+=1000){
    let q=sb.from(c).select('*').order(ord);if(c!=='days')q=q.order('id');
    const {data,error}=await q.range(from,from+999);if(error)throw error;
    out.push(...data);if(data.length<1000)break}
  return out}
async function load(c){
  try{const rows=await fetchAll(c);
    if(c==='days'){D={};rows.forEach(r=>{const o={};DAYF.forEach(k=>{if(r[k]!=null)o[k]=r[k]});D[r.day]=o})}
    else{S[c]=rows;$('#f-inv')&&!$('#f-inv').value&&($('#f-inv').value=nextInv())}
    render()}catch(e){note('Could not load '+c+': '+((e&&e.message)||e))}}
const T_={};const loadSoon=c=>{clearTimeout(T_[c]);T_[c]=setTimeout(()=>load(c),250)};
async function add(c,o){try{const {data,error}=await sb.from(c).insert(o).select().single();if(error)throw error;if(!S[c].some(x=>x.id===data.id))S[c].push(data);render()}catch(e){oops(e)}}
async function upd(c,id,o){try{const {data,error}=await sb.from(c).update(o).eq('id',id).select().single();if(error)throw error;Object.assign(S[c].find(x=>x.id===id)||{},data);render()}catch(e){oops(e)}}
async function del(c,id){try{const {error,count}=await sb.from(c).delete({count:'exact'}).eq('id',id);if(error)throw error;if(!count)throw new Error('not allowed, or already deleted');S[c]=S[c].filter(x=>x.id!==id);render()}catch(e){oops(e)}}
async function setDay(d,o){try{const m={...(D[d]||{}),...o},row={day:d,ob:num(m.ob),drinks:num(m.drinks),other:num(m.other)};
  const {error}=await sb.from('days').upsert(row);if(error)throw error;
  const n={};DAYF.forEach(k=>{if(row[k]!=null)n[k]=row[k]});D[d]=n;render()}catch(e){oops(e)}}
/* downloads: plain browser download (replaces the claude.ai 'downloads' service) */
const dl={save:async({filename,data})=>{
  const type=filename.endsWith('.pdf')?'application/pdf':filename.endsWith('.json')?'application/json':'text/csv;charset=utf-8';
  const blob=new Blob([filename.endsWith('.csv')?['\ufeff',data]:[data]].flat(),{type});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000)}};
/* login / logout */
function showLogin(msg){$('#warn').innerHTML=`<div class="card" style="max-width:360px;margin:20px auto"><h2>Sign in</h2><label>Email</label><input id="lg-email" type="email" autocomplete="username"><label style="margin-top:8px">Password</label><input id="lg-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><div style="margin-top:12px"><button class="p" onclick="doLogin()">Sign in</button></div>${msg?`<div class="warn" style="margin-top:10px">${esc(msg)}</div>`:''}</div>`}
async function doLogin(){const {data,error}=await sb.auth.signInWithPassword({email:$('#lg-email').value.trim(),password:$('#lg-pass').value});if(error)return showLogin(error.message);start(data.session)}
async function signOut(){await sb.auth.signOut();location.reload()}
/* backup / restore (JSON) – also used to move old data in from the claude.ai version */
async function exportAll(){const strip=({id,created_at,...r})=>r;
  await dl.save({filename:'backup-'+today()+'.json',data:JSON.stringify({app:'daily-sale-manager',version:1,exported:new Date().toISOString(),entries:S.entries.map(strip),expenses:S.expenses.map(strip),days:D},null,1)})}
async function importAll(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  if(RO)return note('View-only access: restore is not allowed.');
  try{const j=JSON.parse(await f.text()),t=v=>v==null?'':String(v);
    if((S.entries.length||S.expenses.length)&&!confirm('This database already has data. Restoring a backup on top of it can create duplicates. Continue?'))return;
    const E=(j.entries||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).map(e=>({date:e.date,type:e.type,inv:t(e.inv),staff:t(e.staff),st:t(e.st),cust:t(e.cust),amt:+e.amt||0,mode:t(e.mode),bill:+e.bill||0,settled:!!e.settled,ts:e.ts||null}));
    const X=(j.expenses||[]).map(x=>({date:x.date,cat:t(x.cat),item:t(x.item),amt:+x.amt||0,type:t(x.type),src:t(x.src),staff:t(x.staff)}));
    const Y=Object.entries(j.days||{}).map(([d,v])=>({day:d,ob:num(v.ob),drinks:num(v.drinks),other:num(v.other)}));
    for(const [tb,rows] of [['entries',E],['expenses',X],['days',Y]])for(let i=0;i<rows.length;i+=500){
      const part=rows.slice(i,i+500),{error}=await(tb==='days'?sb.from(tb).upsert(part):sb.from(tb).insert(part));if(error)throw error}
    await Promise.all(['entries','expenses','days'].map(load));
    note('Restored '+E.length+' entries, '+X.length+' expenses, '+Y.length+' day records.')}catch(e){oops(e)}}

/* ---- business rules ----
 SALE: cash received + incentive.  ADV: cash received, NO incentive.
 INV: incentive only, no cash.      NP: not paid, ignored.            */
const live=e=>e.mode!=='NP'&&e.mode!=='PAID EARLIER';
function stats(date){
  const m={},st={};let rs=0,ws=0,cash=0;
  S.entries.filter(e=>e.date===date&&live(e)).forEach(e=>{
    const a=+e.amt||0;
    if(e.type!=='INV'&&e.mode!=='PAID EARLIER'){(m[e.mode]=m[e.mode]||{RS:0,WS:0})[e.st]+=a;e.st==='RS'?rs+=a:ws+=a;if(e.mode==='CASH')cash+=a}
    const s=st[e.staff]=st[e.staff]||{RS:0,WS:0,adv:0};
    if(e.type==='ADV')s.adv+=a;else s[e.st]+=a;
  });
  return {m,st,rs,ws,cash,total:rs+ws};
}
function closings(){
  const ds=[...new Set([...S.entries.map(e=>e.date),...S.expenses.map(x=>x.date),...Object.keys(D)])].sort();
  const out={};let prev=0;
  ds.forEach(d=>{const s=stats(d),dd=D[d]||{};
    const exp=S.expenses.filter(x=>x.date===d&&cashSrc(x)).reduce((a,x)=>a+(+x.amt||0),0);
    const ob=(dd.ob!==undefined&&dd.ob!=='')?+dd.ob:prev;
    const cl=ob+s.cash-exp+(+dd.drinks||0)+(+dd.other||0);
    out[d]={ob,exp,cl,s};prev=cl});
  return out;
}
function groups(){
  const g={};
  S.entries.filter(e=>!e.settled&&((e.type==='ADV'&&live(e))||(e.type==='SALE'&&e.mode==='NP'))).forEach(e=>{
    const k=e.inv?e.inv+'|'+e.staff:'id'+e.id;
    const x=g[k]=g[k]||{k,inv:e.inv,staff:e.staff,st:e.st,cust:'',bill:0,paid:0,np:0,ids:[]};
    if(e.mode==='NP')x.np+=+e.amt||0;else{x.bill=Math.max(x.bill,+e.bill||0);x.paid+=+e.amt||0}
    x.ids.push(e.id);if(e.cust)x.cust=e.cust});
  return Object.values(g).map(x=>({...x,bill:Math.max(x.bill,x.paid+x.np)}));
}
const nextInv=()=>{const n=S.entries.map(e=>parseInt(e.inv)).filter(x=>x>0);return n.length?Math.max(...n)+1:''};

/* ---- Entry tab ---- */
function lineHTML(){return `<div class="ln"><input type="number" class="la" min="0" placeholder="Amount ₹" inputmode="numeric"><select class="lm">${opts(MODES)}</select><button class="s" onclick="this.parentNode.remove()">×</button></div>`}
function buildEntry(){
  $('#entry').innerHTML=`<div class="card noprint wr"><h2>New bill entry</h2>
  <div class="grid">
   <div><label>Date</label><input type="date" id="f-date" value="${day}" onchange="day=this.value;render()"></div>
   <div><label>Type</label><select id="f-type" onchange="typeChg()"><option>SALE</option><option>ADV</option><option>INV</option></select></div>
   <div><label>Invoice no.</label><input id="f-inv" inputmode="numeric"></div>
   <div><label>Salesperson</label><select id="f-staff"><option value="">Select…</option>${opts(STAFF)}</select></div>
   <div><label>Retail / Wholesale</label><select id="f-st"><option value="RS">Retail</option><option value="WS">Wholesale</option></select></div>
   <div><label>Customer / remark</label><input id="f-cust"></div>
   <div id="billbox" hidden><label>Full bill amount ₹</label><input type="number" id="f-bill" inputmode="numeric"></div>
  </div>
  <div style="margin-top:10px"><label id="paylbl">Payments received (split between modes if needed)</label><div id="lines">${lineHTML()}</div>
  <button class="s" id="addln" onclick="$('#lines').insertAdjacentHTML('beforeend',lineHTML())">+ Add payment mode</button></div>
  <div style="margin-top:12px"><button class="p" onclick="save()">Save entry</button></div>
  <div class="help"><b>SALE</b> = full amount received now: counts in the daily sale and the salesman’s incentive. <b>ADV</b> = advance or part payment: counts in the daily cash received but <u>not</u> in the incentive; it appears under Pending bills. <b>INV</b> = incentive only, no cash. When the customer pays the balance, use <b>Pending bills → Settle</b>: the last payment is recorded as SALE and the earlier advances as INV, so the incentive gets the full bill. Mode <b>PAID EARLIER</b> = this part was already counted in the daily sale and the incentive on an earlier day, so it is <u>not</u> added again to either. Mode <b>NP</b> = bill not paid: it is not counted in the sale or incentive, and goes to Pending bills automatically.</div></div>
  <div class="card"><div id="dayhead"></div><div class="sc" id="elist"></div></div>`;
  $('#f-inv').value=nextInv();
}
function typeChg(){const t=$('#f-type').value;$('#billbox').hidden=t!=='ADV';
  document.querySelectorAll('#lines .lm').forEach(s=>s.hidden=t==='INV');
  $('#paylbl').textContent=t==='INV'?'Amount counted for incentive (no cash)':'Payments received (split between modes if needed)';
  $('#addln').hidden=t==='INV'}
async function save(){
  const t=$('#f-type').value,date=$('#f-date').value,staff=$('#f-staff').value,st=$('#f-st').value,inv=$('#f-inv').value.trim(),cust=$('#f-cust').value.trim(),bill=+$('#f-bill').value||0;
  const L=[...document.querySelectorAll('#lines .ln')].map(l=>({amt:+l.querySelector('.la').value,mode:t==='INV'?'-':l.querySelector('.lm').value})).filter(l=>l.amt>0);
  if(!date||!staff||!L.length)return note('Please choose the date and salesperson, and enter an amount.');
  if(t==='ADV'){const sum=L.reduce((a,l)=>a+l.amt,0);if(!bill||bill<sum)return note('Enter the full bill amount (it must be at least the advance paid).')}
  for(const l of L)await add('entries',{date,type:t,inv,staff,st,cust,amt:l.amt,mode:l.mode,bill:t==='ADV'?bill:0,settled:false,ts:Date.now()});
  day=date;$('#lines').innerHTML=lineHTML();typeChg();$('#f-bill').value='';$('#f-cust').value='';$('#f-inv').value=nextInv();
}
function renderList(){
  const s=stats(day),L=S.entries.filter(e=>e.date===day).sort((a,b)=>(a.ts||0)-(b.ts||0));
  $('#dayhead').innerHTML=`<h2>Entries for ${day}</h2><div class="mut">Received today: Retail ₹${fmt(s.rs)} · Wholesale ₹${fmt(s.ws)} · <b>Total ₹${fmt(s.total)}</b> · ${L.length} rows</div>`;
  $('#elist').innerHTML=L.length?`<table><thead><tr><th>Inv</th><th>Type</th><th>Staff</th><th>R/W</th><th>Customer</th><th>Mode</th><th>Amount</th><th></th></tr></thead><tbody>${L.map(e=>`<tr><td>${esc(e.inv)}</td><td><span class="tag">${e.type}</span></td><td>${esc(e.staff)}</td><td>${e.st}</td><td>${esc(e.cust)}</td><td>${esc(e.mode)}${e.mode==='NP'&&!e.settled?' <span class="tag">in pending</span>':''}</td><td>${fmt(e.amt)}</td><td><span class="wr"><button class="s" onclick="openEdit('${e.id}')">Edit</button> <button class="s" onclick="ask('Delete this entry?',()=>del('entries','${e.id}'))">Delete</button></span></td></tr>`).join('')}</tbody></table>`:'<div class="mut">No entries yet for this date.</div>';
}

function openEdit(id){
  const e=S.entries.find(x=>x.id===id);if(!e)return;
  const sel=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
  $('#mbox').innerHTML=`<h2>Edit entry</h2><div class="grid">
  <div><label>Date</label><input type="date" id="e-date" value="${e.date}"></div>
  <div><label>Type</label><select id="e-type">${sel(['SALE','ADV','INV'],e.type)}</select></div>
  <div><label>Invoice no.</label><input id="e-inv" value="${esc(e.inv)}"></div>
  <div><label>Salesperson</label><select id="e-staff">${sel([...new Set([...STAFF,e.staff])],e.staff)}</select></div>
  <div><label>Retail / Wholesale</label><select id="e-st"><option value="RS"${e.st==='RS'?' selected':''}>Retail</option><option value="WS"${e.st==='WS'?' selected':''}>Wholesale</option></select></div>
  <div><label>Customer / remark</label><input id="e-cust" value="${esc(e.cust)}"></div>
  <div><label>Payment mode</label><select id="e-mode">${sel([...MODES,'-'],e.mode)}</select></div>
  <div><label>Amount ₹</label><input type="number" id="e-amt" value="${e.amt}"></div>
  <div><label>Full bill ₹ (ADV only)</label><input type="number" id="e-bill" value="${e.bill||''}"></div></div>
  <div style="margin-top:10px;display:flex;gap:8px"><button class="p" onclick="saveEdit('${id}')">Save changes</button><button class="s" onclick="$('#modal').style.display='none'">Cancel</button></div>`;
  $('#modal').style.display='flex';
}
async function saveEdit(id){
  const t=$('#e-type').value,amt=+$('#e-amt').value,bill=+$('#e-bill').value||0;
  if(!$('#e-date').value||!amt)return note('Date and amount are required.');
  if(t==='ADV'&&bill<amt)return note('The full bill amount must be at least the advance paid.');
  await upd('entries',id,{date:$('#e-date').value,type:t,inv:$('#e-inv').value.trim(),staff:$('#e-staff').value,st:$('#e-st').value,cust:$('#e-cust').value.trim(),mode:$('#e-mode').value,amt,bill:t==='ADV'?bill:0});
  $('#modal').style.display='none';
}
/* ---- Day report ---- */
function renderReport(){
  const C=closings(),dd=D[day]||{};let c=C[day];
  if(!c){const prev=Object.keys(C).filter(d=>d<day).sort().pop();c={ob:prev?C[prev].cl:0,exp:0,cl:0,s:stats(day)};c.cl=c.ob}
  const s=c.s,X=S.expenses.filter(x=>x.date===day);
  const rows=MODES.filter(m=>m!=='NP'&&s.m[m]).map(m=>`<tr><td>${m}</td><td>${fmt(s.m[m].RS)}</td><td>${fmt(s.m[m].WS)}</td><td>${fmt(s.m[m].RS+s.m[m].WS)}</td></tr>`).join('');
  const sr=Object.keys(s.st).sort().map(n=>{const a=s.st[n];return `<tr><td>${esc(n)}</td><td>${fmt(a.RS)}</td><td>${fmt(a.WS)}</td><td>${fmt(a.RS+a.WS)}</td><td>${fmt(a.adv)}</td></tr>`}).join('');

async function doSettle(k){
  const g=groups().find(x=>x.k===k);if(!g)return;const bal=g.bill-g.paid;
  const L=[...document.querySelectorAll('#mlines .ln')].map(l=>({amt:+l.querySelector('.la').value,mode:l.querySelector('.lm').value})).filter(l=>l.amt>0);
  if(Math.abs(L.reduce((a,l)=>a+l.amt,0)-bal)>0.5)return note('The last payment must equal the balance ₹'+fmt(bal)+'. For a part payment, add another ADV entry instead.');
  const date=today(),base={date,inv:g.inv,staff:g.staff,st:g.st,cust:g.cust,bill:0,settled:true,ts:Date.now()};
  for(const l of L)await add('entries',{...base,type:'SALE',amt:l.amt,mode:l.mode});
  if(g.paid>0)await add('entries',{...base,type:'INV',amt:g.paid,mode:'-'});
  for(const id of g.ids)await upd('entries',id,{settled:true});
  $('#modal').style.display='none';
}
